groups:
  - name: sample-service.slo.saturation-burnrate-alerts
    # Matches the 15s interval override on the saturation recording-rule
    # groups (prometheus/saturation_recording_rules.yml) so this group's
    # `for:` pending timers advance on the same cadence the underlying
    # burn-rate series actually updates, instead of drifting out of phase
    # with it under a different global evaluation_interval.
    interval: 15s
    rules:
      # Tier 1 - fast burn, pages. At this rate the full 30-day saturation
      # budget is exhausted in about 2 days.
      - alert: SampleServiceSaturationBudgetBurnFast
        expr: |
          sample_service:saturation_burnrate1h >= 14.4
          and
          sample_service:saturation_burnrate5m >= 14.4
        for: 2m
        labels:
          severity: critical
          slo: sample-service-saturation
          window: fast
        annotations:
          summary: "sample-service is burning its saturation budget >14x too fast"
          description: >-
            The fraction of time the work queue spent over its 50-item
            saturation threshold, over the last 1h AND the last 5m, both
            exceed 14.4x the allowed SLO burn rate for the 98%
            not-saturated objective. At this rate the 30-day saturation
            budget is exhausted in ~2 days. See
            docs/runbook.md#saturation-slo.

      # Tier 2 - medium-fast burn, pages. Budget exhausted in about 5 days.
      - alert: SampleServiceSaturationBudgetBurnMediumFast
        expr: |
          sample_service:saturation_burnrate6h >= 6
          and
          sample_service:saturation_burnrate30m >= 6
        for: 15m
        labels:
          severity: critical
          slo: sample-service-saturation
          window: medium-fast
        annotations:
          summary: "sample-service is burning its saturation budget >6x too fast"
          description: >-
            The fraction of time the work queue spent over its 50-item
            saturation threshold, over the last 6h AND the last 30m, both
            exceed 6x the allowed SLO burn rate for the 98% not-saturated
            objective. At this rate the 30-day saturation budget is
            exhausted in ~5 days. See docs/runbook.md#saturation-slo.

      # Tier 3 - slow burn, ticket. Budget exhausted in about 10 days.
      - alert: SampleServiceSaturationBudgetBurnSlow
        expr: |
          sample_service:saturation_burnrate1d >= 3
          and
          sample_service:saturation_burnrate2h >= 3
        for: 1h
        labels:
          severity: warning
          slo: sample-service-saturation
          window: slow
        annotations:
          summary: "sample-service is burning its saturation budget 3x too fast"
          description: >-
            The fraction of time the work queue spent over its 50-item
            saturation threshold, over the last 1d AND the last 2h, both
            exceed 3x the allowed SLO burn rate for the 98% not-saturated
            objective. At this rate the 30-day saturation budget is
            exhausted in ~10 days. See docs/runbook.md#saturation-slo.

      # Tier 4 - very slow burn, ticket. Budget exhausted right around the
      # 30-day window, i.e. the saturation SLO itself is at risk this
      # period.
      - alert: SampleServiceSaturationBudgetBurnVerySlow
        expr: |
          sample_service:saturation_burnrate3d >= 1
          and
          sample_service:saturation_burnrate6h >= 1
        for: 3h
        labels:
          severity: warning
          slo: sample-service-saturation
          window: very-slow
        annotations:
          summary: "sample-service is on track to exhaust its 30-day saturation budget"
          description: >-
            The fraction of time the work queue spent over its 50-item
            saturation threshold, over the last 3d AND the last 6h, both
            exceed the allowed SLO burn rate for the 98% not-saturated
            objective. At this rate the 30-day saturation budget will be
            fully exhausted by the end of the period. See
            docs/runbook.md#saturation-slo.
