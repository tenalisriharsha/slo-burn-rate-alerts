groups:
  - name: sample-service.slo.latency-burnrate-alerts
    rules:
      # Tier 1 - fast burn, pages. At this rate the full 30-day latency
      # budget is exhausted in about 2 days.
      - alert: SampleServiceLatencyBudgetBurnFast
        expr: |
          sample_service:latency_burnrate1h >= 14.4
          and
          sample_service:latency_burnrate5m >= 14.4
        for: 2m
        labels:
          severity: critical
          slo: sample-service-latency
          window: fast
        annotations:
          summary: "sample-service is burning its latency budget >14x too fast"
          description: >-
            The fraction of requests over the 300ms p99 target, over the
            last 1h AND the last 5m, both exceed 14.4x the allowed SLO burn
            rate for the 99% latency objective. At this rate the 30-day
            latency budget is exhausted in ~2 days. See
            docs/runbook.md#latency-slo.

      # Tier 2 - medium-fast burn, pages. Budget exhausted in about 5 days.
      - alert: SampleServiceLatencyBudgetBurnMediumFast
        expr: |
          sample_service:latency_burnrate6h >= 6
          and
          sample_service:latency_burnrate30m >= 6
        for: 15m
        labels:
          severity: critical
          slo: sample-service-latency
          window: medium-fast
        annotations:
          summary: "sample-service is burning its latency budget >6x too fast"
          description: >-
            The fraction of requests over the 300ms p99 target, over the
            last 6h AND the last 30m, both exceed 6x the allowed SLO burn
            rate for the 99% latency objective. At this rate the 30-day
            latency budget is exhausted in ~5 days. See
            docs/runbook.md#latency-slo.

      # Tier 3 - slow burn, ticket. Budget exhausted in about 10 days.
      - alert: SampleServiceLatencyBudgetBurnSlow
        expr: |
          sample_service:latency_burnrate1d >= 3
          and
          sample_service:latency_burnrate2h >= 3
        for: 1h
        labels:
          severity: warning
          slo: sample-service-latency
          window: slow
        annotations:
          summary: "sample-service is burning its latency budget 3x too fast"
          description: >-
            The fraction of requests over the 300ms p99 target, over the
            last 1d AND the last 2h, both exceed 3x the allowed SLO burn
            rate for the 99% latency objective. At this rate the 30-day
            latency budget is exhausted in ~10 days. See
            docs/runbook.md#latency-slo.

      # Tier 4 - very slow burn, ticket. Budget exhausted right around the
      # 30-day window, i.e. the latency SLO itself is at risk this period.
      - alert: SampleServiceLatencyBudgetBurnVerySlow
        expr: |
          sample_service:latency_burnrate3d >= 1
          and
          sample_service:latency_burnrate6h >= 1
        for: 3h
        labels:
          severity: warning
          slo: sample-service-latency
          window: very-slow
        annotations:
          summary: "sample-service is on track to exhaust its 30-day latency budget"
          description: >-
            The fraction of requests over the 300ms p99 target, over the
            last 3d AND the last 6h, both exceed the allowed SLO burn rate
            for the 99% latency objective. At this rate the 30-day latency
            budget will be fully exhausted by the end of the period. See
            docs/runbook.md#latency-slo.
