name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-prometheus-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config + rules
        run: make check-prometheus

  validate-alertmanager-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: amtool check-config
        run: make check-alertmanager

  lint-sample-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -r sample-service/requirements-dev.txt
      - name: make lint
        run: make lint

  test-sample-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r sample-service/requirements.txt
          if [ -f sample-service/requirements-dev.txt ]; then
            pip install -r sample-service/requirements-dev.txt
          fi
          pip install pytest
      - name: Run tests
        run: |
          if [ -d tests ] || ls sample-service/test_*.py sample-service/*_test.py sample-service/tests >/dev/null 2>&1; then
            pytest
          else
            echo "No tests found yet"
          fi

  integration-test:
    # Brings up the real docker-compose stack (sample-service + Prometheus +
    # Alertmanager) and watches a simulated incident move an alert from
    # inactive to firing and show up correctly routed in Alertmanager - see
    # tests/integration/test_stack.py. Only this job needs RUN_INTEGRATION=1;
    # it's skipped by default in test-sample-service above.
    #
    # This takes several minutes (it waits for a real burn-rate window to
    # clear its threshold), so it only runs automatically on pushes to main
    # - every PR still gets the fast config-validate/lint/unit-test jobs
    # above. Trigger it on demand for a PR via "Run workflow" (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r sample-service/requirements.txt
          pip install pytest requests
      - name: Run docker-compose integration tests
        env:
          RUN_INTEGRATION: "1"
        run: pytest tests/integration -m integration -v
