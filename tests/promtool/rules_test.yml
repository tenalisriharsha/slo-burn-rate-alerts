# promtool unit tests for prometheus/alerting_rules.yml.
#
# Each alert tier gets two scenarios: a sustained burn rate just under its
# documented threshold (must never fire, not even reach "pending"), and a
# sustained burn rate well over it (must be "firing" once both the
# threshold's long window has enough history to be accurate and the alert's
# `for` duration has elapsed). The eval_time in every "above" case is chosen
# as (longest window used by that tier) + (that tier's `for` duration) plus
# a margin, because rate() under-estimates a counter's true slope until the
# queried window is fully covered by samples.
#
# Run via: docker run --rm -v "$PWD":/work -w /work --entrypoint promtool
#   prom/prometheus:latest test rules tests/promtool/rules_test.yml
# (see tests/promtool/test_promtool.py, which runs exactly that).
rule_files:
  - ../../prometheus/recording_rules.yml
  - ../../prometheus/alerting_rules.yml

evaluation_interval: 1m

tests:
  # --- Tier 1: SampleServiceErrorBudgetBurnFast (1h & 5m windows, >=14.4x, for: 2m) ---
  - interval: 30s
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+990x135'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+10x135'
    alert_rule_test:
      - eval_time: 65m
        alertname: SampleServiceErrorBudgetBurnFast
        exp_alerts: []

  - interval: 30s
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+970x135'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+30x135'
    alert_rule_test:
      - eval_time: 65m
        alertname: SampleServiceErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: sample-service-availability
              window: fast
            exp_annotations:
              summary: "sample-service is burning its error budget >14x too fast"
              description: >-
                Error ratio over the last 1h AND the last 5m both exceed 14.4x the
                allowed SLO burn rate for the 99.9% availability objective. At this
                rate the 30-day error budget is exhausted in ~2 days. See
                docs/runbook.md#fast-burn-page.

  # --- Tier 2: SampleServiceErrorBudgetBurnMediumFast (6h & 30m windows, >=6x, for: 15m) ---
  - interval: 5m
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+997x85'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+3x85'
    alert_rule_test:
      - eval_time: 6h40m
        alertname: SampleServiceErrorBudgetBurnMediumFast
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+985x85'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+15x85'
    alert_rule_test:
      - eval_time: 6h40m
        alertname: SampleServiceErrorBudgetBurnMediumFast
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: sample-service-availability
              window: medium-fast
            exp_annotations:
              summary: "sample-service is burning its error budget >6x too fast"
              description: >-
                Error ratio over the last 6h AND the last 30m both exceed 6x the
                allowed SLO burn rate for the 99.9% availability objective. At this
                rate the 30-day error budget is exhausted in ~5 days. See
                docs/runbook.md#medium-fast-burn-page.

  # --- Tier 3: SampleServiceErrorBudgetBurnSlow (1d & 2h windows, >=3x, for: 1h) ---
  - interval: 30m
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+998.5x56'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+1.5x56'
    alert_rule_test:
      - eval_time: 26h
        alertname: SampleServiceErrorBudgetBurnSlow
        exp_alerts: []

  - interval: 30m
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+991x56'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+9x56'
    alert_rule_test:
      - eval_time: 26h
        alertname: SampleServiceErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: sample-service-availability
              window: slow
            exp_annotations:
              summary: "sample-service is burning its error budget 3x too fast"
              description: >-
                Error ratio over the last 1d AND the last 2h both exceed 3x the
                allowed SLO burn rate for the 99.9% availability objective. At this
                rate the 30-day error budget is exhausted in ~10 days. See
                docs/runbook.md#slow-burn-ticket.

  # --- Tier 4: SampleServiceErrorBudgetBurnVerySlow (3d & 6h windows, >=1x, for: 3h) ---
  - interval: 1h
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+999.7x82'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+0.3x82'
    alert_rule_test:
      - eval_time: 3d6h
        alertname: SampleServiceErrorBudgetBurnVerySlow
        exp_alerts: []

  - interval: 1h
    input_series:
      - series: 'http_requests_total{job="sample-service",method="GET",code="200"}'
        values: '0+995x82'
      - series: 'http_requests_total{job="sample-service",method="GET",code="500"}'
        values: '0+5x82'
    alert_rule_test:
      - eval_time: 3d6h
        alertname: SampleServiceErrorBudgetBurnVerySlow
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: sample-service-availability
              window: very-slow
            exp_annotations:
              summary: "sample-service is on track to exhaust its 30-day error budget"
              description: >-
                Error ratio over the last 3d AND the last 6h both exceed the
                allowed SLO burn rate for the 99.9% availability objective. At this
                rate the 30-day error budget will be fully exhausted by the end of
                the period. See docs/runbook.md#very-slow-burn-ticket.
