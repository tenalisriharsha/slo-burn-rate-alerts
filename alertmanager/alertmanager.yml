global:
  resolve_timeout: 5m

# Routing tree: SLO burn-rate alerts carry a `severity` label of either
# `critical` (fast/medium-fast burn -> should page someone now) or `warning`
# (slow/very-slow burn -> fine as a ticket for business hours). See
# docs/runbook.md for why each tier maps the way it does.
route:
  receiver: default
  group_by: [alertname, slo]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: page
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    - matchers:
        - severity="warning"
      receiver: ticket
      repeat_interval: 12h
      continue: false

# Inhibit the slower, lower-confidence tiers once a faster tier for the same
# SLO has already fired - they are describing the same underlying incident
# at different time horizons, so paging and filing a ticket for both is noise.
inhibit_rules:
  - source_matchers:
      - window="fast"
    target_matchers:
      - window=~"medium-fast|slow|very-slow"
    equal: [slo]
  - source_matchers:
      - window="medium-fast"
    target_matchers:
      - window=~"slow|very-slow"
    equal: [slo]
  - source_matchers:
      - window="slow"
    target_matchers:
      - window="very-slow"
    equal: [slo]

receivers:
  # No integrations are active by default: this repo is a reference
  # implementation, not a live on-call setup, and shipping a real webhook
  # URL or API key in a public repo would be a leaked credential. Alerts
  # still show up in the Alertmanager UI and API with no receiver configured.
  # See docs/integrations.md for the exact steps to turn the `page` and
  # `ticket` blocks below from comments into a real PagerDuty/Slack
  # integration - get a credential, write it to a file under
  # alertmanager/secrets/ (gitignored, never committed), uncomment,
  # `make check`, restart. This pinned Alertmanager version has no
  # `${VAR}`-style env-var expansion for secret fields, so the credential
  # has to reach the config through a file Alertmanager reads at startup
  # instead of through the process environment.
  - name: default

  - name: page
    # PagerDuty - fires for severity=critical (the fast/medium-fast tiers).
    # 1. Create a PagerDuty service with a "Prometheus" or "Events API v2"
    #    integration and copy its integration key.
    # 2. Write it to alertmanager/secrets/pagerduty_routing_key (no
    #    trailing newline) and uncomment the block below.
    # pagerduty_configs:
    #   - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
    #     severity: '{{ .CommonLabels.severity }}'
    #     description: '{{ .CommonAnnotations.summary }}'
    #     details:
    #       slo: '{{ .CommonLabels.slo }}'
    #       window: '{{ .CommonLabels.window }}'
    #       runbook: 'https://github.com/tenalisriharsha/slo-burn-rate-alerts/blob/main/docs/runbook.md'

  - name: ticket
    # Slack - fires for severity=warning (the slow/very-slow tiers).
    # 1. Create a Slack incoming webhook for the channel you want tickets
    #    filed in (Slack app settings -> Incoming Webhooks).
    # 2. Write it to alertmanager/secrets/slack_webhook_url (no trailing
    #    newline) and uncomment the block below.
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
    #     channel: '#slo-tickets'
    #     title: '{{ .CommonLabels.alertname }}: {{ .CommonLabels.slo }}'
    #     text: >-
    #       {{ .CommonAnnotations.description }}
    #       (window={{ .CommonLabels.window }}, severity={{ .CommonLabels.severity }})
    #     send_resolved: true
